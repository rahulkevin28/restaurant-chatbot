# Redirect HTTP -> HTTPS and serve ACME challenge for certbot if used
server {
    listen 80;
    server_name example.com www.example.com;

    # Let's Encrypt ACME challenge location (if you use certbot container)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    # TLS cert locations (mounted from host or certbot)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS (enable only after you verify HTTPS works)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Recommended security headers (nginx should set these; avoid duplicating in Flask)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data: https:;" always;

    # Limits
    client_max_body_size 16M;  # tune if you accept larger uploads

    # Proxy settings
    location / {
        proxy_pass http://app:8000;               # <-- use Docker service name + internal port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 and connection settings for upstream keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts and buffering
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
        proxy_buffer_size 32k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 64k;

        # Websocket support (if you ever need it)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Optional healthcheck endpoint proxied (useful for Docker healthchecks)
    location = /ready {
        proxy_pass http://app:8000/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional: serve static files directly from nginx if you mount them
    # location /static/ {
    #     alias /var/www/static/;
    # }
}
